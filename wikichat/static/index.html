<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Chat</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --side:#efefeb; --text:#1d1d1b; --muted:#6b6b66; --accent:#2b5fd9; --border:#e2e2dc; --user:#e8eefc; --hover:#e4e4de; --danger:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --panel:#1f2024; --side:#1b1c20; --text:#e8e8e6; --muted:#9a9a95; --accent:#7aa2ff; --border:#2e3036; --user:#25304a; --hover:#2a2c32; --danger:#ff7b6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; }
  button { font:inherit; cursor:pointer; }

  /* Barra lateral */
  #side { width:270px; flex:none; background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column; }
  #new { margin:12px; padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--panel); color:var(--text); text-align:left; }
  #new:hover { background:var(--hover); }
  #chats { flex:1; overflow-y:auto; padding:0 8px 12px; list-style:none; margin:0; }
  #chats li { display:flex; align-items:center; gap:4px; border-radius:7px; padding:2px 4px 2px 10px; }
  #chats li:hover, #chats li.active { background:var(--hover); }
  #chats li.active { font-weight:600; }
  #chats .t { flex:1; min-width:0; padding:7px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; font-size:14px; }
  #chats input { flex:1; min-width:0; font:inherit; font-size:14px; padding:5px 6px; border:1px solid var(--accent); border-radius:5px; background:var(--panel); color:var(--text); }
  #chats .act { border:0; background:none; color:var(--muted); padding:4px 6px; border-radius:5px; font-size:14px; opacity:0; }
  #chats li:hover .act, #chats li.active .act { opacity:1; }
  #chats .act:hover { background:var(--border); color:var(--text); }
  #chats .act.del:hover { color:var(--danger); }
  #chats .empty { color:var(--muted); font-size:14px; padding:8px 10px; }
  body.busy #chats, body.busy #new { pointer-events:none; opacity:.6; }

  /* Zona principal */
  main { flex:1; min-width:0; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  #toggle { display:none; border:0; background:none; color:var(--text); font-size:20px; padding:0 4px; }
  header h1 { font-size:16px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #stats { font-size:12px; color:var(--muted); text-align:right; }
  #log { flex:1; overflow-y:auto; padding:16px; }
  #log > * { max-width:820px; margin-left:auto; margin-right:auto; }
  .welcome { color:var(--muted); text-align:center; margin-top:18vh; }
  .welcome h2 { color:var(--text); font-weight:600; margin:0 0 6px; }
  .msg { padding:10px 14px; border-radius:10px; margin-top:10px; margin-bottom:10px; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:var(--user); margin-left:max(15%, calc((100% - 820px) / 2 + 15%)); }
  .bot { background:var(--panel); border:1px solid var(--border); }
  .src { font-size:13px; color:var(--muted); margin-top:8px; white-space:normal; }
  /* Mientras el modelo piensa */
  .thinking { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; white-space:normal; }
  .dots { display:inline-flex; gap:4px; flex:none; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--accent); opacity:.25; animation:pulse 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay:.2s; }
  .dots i:nth-child(3) { animation-delay:.4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity:.25; transform:scale(.85); } 40% { opacity:1; transform:scale(1); } }
  .thinking .secs { font-variant-numeric:tabular-nums; opacity:.8; }
  .streaming > span::after { content:"▍"; margin-left:1px; color:var(--accent); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) {
    .dots i, .streaming > span::after { animation:none; opacity:.7; }
  }
  .pics { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; margin-top:10px; white-space:normal; }
  .pics figure { margin:0; }
  .pics img { width:100%; height:110px; object-fit:cover; border-radius:6px; background:var(--border); display:block; }
  .pics figcaption { font-size:12px; color:var(--muted); margin-top:3px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
  #q { flex:1; resize:none; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); max-width:740px; margin-left:auto; }
  #send { padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; margin-right:auto; }
  #send:disabled { opacity:.5; cursor:default; }

  @media (max-width: 760px) {
    #side { position:fixed; inset:0 auto 0 0; z-index:10; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 30px rgba(0,0,0,.25); }
    body.side-open #side { transform:none; }
    #toggle { display:block; }
    #stats { display:none; }
    #chats .act { opacity:1; }
    .user { margin-left:10%; }
  }
</style>
</head>
<body>
<aside id="side">
  <button id="new">＋ Nuevo chat</button>
  <ul id="chats"></ul>
</aside>
<main>
  <header>
    <button id="toggle" aria-label="Conversaciones">☰</button>
    <h1 id="title">Nuevo chat</h1>
    <span id="stats"></span>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="q" rows="2" placeholder="Pregunta algo sobre la wiki…" autofocus></textarea>
    <button id="send">Enviar</button>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), q = $('q'), btn = $('send'), list = $('chats');
let current = null;   // id del chat abierto (null = chat nuevo aún sin guardar)
let chats = [];

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts});
  return r.ok ? r.json() : null;
}

async function loadStats() {
  const s = await api('/api/stats').catch(() => null); if (!s) return;
  $('stats').textContent = `${s.pages.toLocaleString()} artículos` +
    (s.semantic_index != null ? ` · semántica: ${s.semantic_index.toLocaleString()}` : '') +
    ` · actualizado: ${s.last_sync ? new Date(s.last_sync).toLocaleDateString() : 'nunca'}`;
}

// ---- Lista de conversaciones -------------------------------------------------------
async function loadChats() {
  chats = (await api('/api/chats')) || [];
  renderChats();
}

function renderChats() {
  list.replaceChildren();
  if (!chats.length) {
    const li = document.createElement('li'); li.className = 'empty';
    li.textContent = 'Tus conversaciones aparecerán aquí.'; list.appendChild(li); return;
  }
  for (const c of chats) {
    const li = document.createElement('li');
    if (c.id === current) li.className = 'active';
    const t = document.createElement('span'); t.className = 't'; t.textContent = c.title; t.title = c.title;
    t.onclick = () => { openChat(c.id); document.body.classList.remove('side-open'); };
    const ren = document.createElement('button'); ren.className = 'act'; ren.textContent = '✎'; ren.title = 'Renombrar';
    ren.onclick = () => startRename(li, c);
    const del = document.createElement('button'); del.className = 'act del'; del.textContent = '✕'; del.title = 'Borrar';
    del.onclick = () => removeChat(c);
    li.append(t, ren, del); list.appendChild(li);
  }
}

function startRename(li, c) {
  const input = document.createElement('input'); input.value = c.title;
  li.replaceChildren(input); input.focus(); input.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true;
    const title = input.value.trim();
    if (save && title && title !== c.title) {
      await api('/api/chats/' + c.id, {method: 'PATCH', body: JSON.stringify({title})});
      if (c.id === current) $('title').textContent = title;
    }
    loadChats();
  };
  input.onkeydown = e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
  input.onblur = () => finish(true);
}

async function removeChat(c) {
  if (!confirm(`¿Borrar la conversación «${c.title}»?`)) return;
  await api('/api/chats/' + c.id, {method: 'DELETE'});
  if (c.id === current) newChat();
  loadChats();
}

// ---- Mensajes ----------------------------------------------------------------------
function welcome() {
  log.innerHTML = '<div class="welcome"><h2>¿Qué quieres saber?</h2>Las respuestas salen de la copia local de la wiki; la conversación se guarda en este equipo.</div>';
}

function addMsg(cls, text) {
  log.querySelector('.welcome')?.remove();
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  const body = document.createElement('span'); body.textContent = text; d.appendChild(body);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return {el: d, body};
}

function addSources(el, sources, images) {
  if (sources && sources.length) {
    const s = document.createElement('div'); s.className = 'src';
    s.textContent = 'Fuentes: ' + [...new Set(sources.map(x => x.title))].join(', ');
    el.appendChild(s);
  }
  if (images && images.length) {
    const g = document.createElement('div'); g.className = 'pics';
    for (const im of images) {
      const f = document.createElement('figure'), img = document.createElement('img'), c = document.createElement('figcaption');
      img.src = '/api/image/' + im.id; img.alt = im.caption; img.loading = 'lazy';
      img.onerror = () => f.remove();   // sin conexión o sin .zim con imágenes
      c.textContent = im.caption; f.title = im.title;
      f.append(img, c); g.appendChild(f);
    }
    el.appendChild(g);
  }
}

function newChat() {
  current = null; history.replaceState(null, '', location.pathname);
  $('title').textContent = 'Nuevo chat'; welcome(); renderChats(); q.focus();
}

async function openChat(id) {
  const chat = await api('/api/chats/' + id);
  if (!chat) return newChat();
  current = id; history.replaceState(null, '', '#' + id);
  $('title').textContent = chat.title;
  log.replaceChildren();
  if (!chat.messages.length) welcome();
  for (const m of chat.messages) {
    const {el} = addMsg(m.role === 'user' ? 'user' : 'bot', m.content);
    if (m.role !== 'user') addSources(el, m.sources, m.images);
  }
  renderChats(); log.scrollTop = log.scrollHeight;
}

// Indicador mientras el modelo lee las fuentes y empieza a responder (en CPU puede tardar
// bastante antes de la primera palabra). Muestra en qué paso va y cuántos segundos lleva.
function thinking(el) {
  const box = document.createElement('div'); box.className = 'thinking';
  box.setAttribute('role', 'status');
  const dots = document.createElement('span'); dots.className = 'dots'; dots.innerHTML = '<i></i><i></i><i></i>';
  const label = document.createElement('span'), secs = document.createElement('span'); secs.className = 'secs';
  box.append(dots, label, secs); el.prepend(box);
  const start = Date.now();
  const tick = () => { const s = Math.floor((Date.now() - start) / 1000); secs.textContent = s ? `· ${s} s` : ''; };
  const timer = setInterval(tick, 1000);
  return {
    set(text) { label.textContent = text; },
    done() { clearInterval(timer); box.remove(); },
  };
}

function readingLabel(sources) {
  const titles = [...new Set(sources.map(s => s.title))];
  if (!titles.length) return 'No encontré fragmentos relacionados; preparando la respuesta…';
  const shown = titles.slice(0, 3).join(', ') + (titles.length > 3 ? '…' : '');
  return `Leyendo ${shown} y redactando la respuesta…`;
}

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; btn.disabled = true; document.body.classList.add('busy');
  addMsg('user', text);
  const {el, body} = addMsg('bot', '');
  const status = thinking(el); status.set('Buscando en la wiki…');
  let answer = '', pending = null, started = false;
  // Fuentes e imágenes llegan antes que el texto; se muestran debajo cuando empieza la respuesta.
  const begin = () => {
    if (started) return; started = true;
    status.done(); el.classList.add('streaming');
    if (pending) addSources(el, pending.sources, pending.images);
  };
  try {
    const resp = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                           body: JSON.stringify({chat_id: current, message: text})});
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const ev = JSON.parse(buf.slice(0, i)); buf = buf.slice(i + 1);
        if (ev.type === 'chat' && ev.id !== current) {
          current = ev.id; history.replaceState(null, '', '#' + ev.id);
          $('title').textContent = ev.title; loadChats();
        }
        if (ev.type === 'sources') {
          pending = ev;
          status.set(ev.model_loaded === false
            ? 'Cargando el modelo en memoria (puede tardar un poco la primera vez)…'
            : readingLabel(ev.sources));
        }
        if (ev.type === 'token') {
          begin();
          answer += ev.text; body.textContent = answer; log.scrollTop = log.scrollHeight;
        }
      }
    }
  } catch (err) { body.textContent = 'Error: ' + err; }
  begin(); el.classList.remove('streaming');
  btn.disabled = false; document.body.classList.remove('busy'); q.focus();
  loadChats();
};

q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('f').requestSubmit(); } });
$('new').onclick = () => { newChat(); document.body.classList.remove('side-open'); };
$('toggle').onclick = (e) => { e.stopPropagation(); document.body.classList.toggle('side-open'); };
document.querySelector('main').addEventListener('click', () => document.body.classList.remove('side-open'));
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== current) openChat(id); });

(async () => {
  await loadChats();
  const id = location.hash.slice(1);
  if (id) openChat(id); else newChat();
  loadStats(); setInterval(loadStats, 60000);
})();
</script>
</body>
</html>
