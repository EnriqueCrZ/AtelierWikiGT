<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Chat</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --accent:#2b5fd9; --border:#e2e2dc; --user:#e8eefc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --panel:#1f2024; --text:#e8e8e6; --muted:#9a9a95; --accent:#7aa2ff; --border:#2e3036; --user:#25304a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  header h1 { font-size:17px; margin:0; }
  #stats { font-size:13px; color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:10px; margin:10px 0; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:var(--user); margin-left:15%; }
  .bot { background:var(--panel); border:1px solid var(--border); }
  .src { font-size:13px; color:var(--muted); margin-top:8px; }
  .pics { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; margin-top:10px; white-space:normal; }
  .pics figure { margin:0; }
  .pics img { width:100%; height:110px; object-fit:cover; border-radius:6px; background:var(--border); display:block; }
  .pics figcaption { font-size:12px; color:var(--muted); margin-top:3px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); }
  button { font:inherit; padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header><h1>Wiki Chat · offline</h1><span id="stats"></span></header>
<div id="log"></div>
<form id="f">
  <textarea id="q" rows="2" placeholder="Pregunta algo sobre la wiki…" autofocus></textarea>
  <button id="send">Enviar</button>
</form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), btn = document.getElementById('send');
const history = [];

async function loadStats() {
  try {
    const s = await (await fetch('/api/stats')).json();
    document.getElementById('stats').textContent =
      `${s.pages.toLocaleString()} artículos` +
      (s.semantic_index != null ? ` · búsqueda semántica: ${s.semantic_index.toLocaleString()}` : '') +
      ` · actualizado: ${s.last_sync ? new Date(s.last_sync).toLocaleString() : 'nunca'}`;
  } catch {}
}

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; btn.disabled = true;
  add('user', text); history.push({role:'user', content:text});
  const bot = add('bot', ''), body = document.createElement('span'); bot.appendChild(body);
  let answer = '';
  try {
    const resp = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages:history})});
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const ev = JSON.parse(buf.slice(0, i)); buf = buf.slice(i + 1);
        if (ev.type === 'token') { answer += ev.text; body.textContent = answer; log.scrollTop = log.scrollHeight; }
        if (ev.type === 'sources' && ev.sources.length) {
          const s = document.createElement('div'); s.className = 'src';
          s.textContent = 'Fuentes: ' + [...new Set(ev.sources.map(x => x.title))].join(', ');
          bot.appendChild(s);
        }
        if (ev.type === 'sources' && ev.images && ev.images.length) {
          const g = document.createElement('div'); g.className = 'pics';
          for (const im of ev.images) {
            const f = document.createElement('figure'), img = document.createElement('img'), c = document.createElement('figcaption');
            img.src = '/api/image/' + im.id; img.alt = im.caption; img.loading = 'lazy';
            img.onerror = () => f.remove();   // sin conexión o sin .zim con imágenes
            c.textContent = im.caption; f.title = im.title;
            f.append(img, c); g.appendChild(f);
          }
          bot.appendChild(g);
        }
      }
    }
  } catch (err) { answer = 'Error: ' + err; body.textContent = answer; }
  history.push({role:'assistant', content:answer});
  btn.disabled = false; q.focus();
};
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
loadStats(); setInterval(loadStats, 60000);
</script>
</body>
</html>
